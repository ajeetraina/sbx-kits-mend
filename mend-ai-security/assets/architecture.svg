<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3af"/>
    </marker>
  </defs>

  <rect width="1240" height="600" fill="#ffffff"/>

  <!-- Host machine -->
  <rect x="28" y="40" width="945" height="508" rx="26" fill="#e9f1fc" stroke="#7aa7e0" stroke-width="2.5"/>
  <text x="62" y="522" fill="#1e4fa3" font-size="21" font-weight="700">Host machine</text>

  <!-- Workspace directories -->
  <rect x="66" y="212" width="152" height="82" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="142" y="246" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">Workspace</text>
  <text x="142" y="268" text-anchor="middle" fill="#6b7280" font-size="13">your code</text>
  <line x1="218" y1="253" x2="272" y2="253" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- microVM sandbox -->
  <rect x="278" y="98" width="262" height="372" rx="13" fill="#ffffff" stroke="#6b7787" stroke-width="2"/>
  <text x="298" y="130" fill="#1f2937" font-size="18" font-weight="700">microVM sandbox</text>
  <text x="522" y="130" text-anchor="end" fill="#8a94a6" font-size="13">container</text>

  <!-- container dashed box -->
  <rect x="298" y="146" width="222" height="176" rx="9" fill="none" stroke="#9aa3af" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Agent / Claude -->
  <rect x="314" y="162" width="190" height="56" rx="7" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="409" y="196" text-anchor="middle" fill="#2f6fdb" font-size="16" font-weight="700">Agent / Claude</text>

  <!-- mend-ai-security mixin -->
  <rect x="314" y="234" width="190" height="74" rx="7" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="409" y="260" text-anchor="middle" fill="#2f6fdb" font-size="15" font-weight="700">mend-ai-security</text>
  <text x="409" y="279" text-anchor="middle" fill="#6b7280" font-size="11.5">mend ai scan · AI-BOM</text>
  <text x="409" y="296" text-anchor="middle" fill="#6b7280" font-size="11.5">kind: mixin</text>

  <!-- mend auth login / token -->
  <rect x="298" y="336" width="222" height="80" rx="9" fill="#ece7dd" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="409" y="366" text-anchor="middle" fill="#6b6255" font-size="13.5" font-weight="600" font-family="'SF Mono', Menlo, monospace">mend auth login</text>
  <text x="409" y="385" text-anchor="middle" fill="#8a8272" font-size="12">CLI's own login handshake</text>
  <text x="409" y="402" text-anchor="middle" fill="#8a8272" font-size="12">token → ~/.mend/config/settings.json</text>

  <!-- sandbox -> proxy -->
  <line x1="540" y1="255" x2="606" y2="255" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- sbx proxy (transparent tunnel, no injection) -->
  <rect x="606" y="212" width="196" height="90" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.8"/>
  <text x="704" y="244" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">sbx proxy</text>
  <text x="704" y="266" text-anchor="middle" fill="#6b7280" font-size="12.5">egress allow-list · *.mend.io</text>
  <text x="704" y="285" text-anchor="middle" fill="#6b7280" font-size="12.5">transparent tunnel — no inject</text>

  <!-- proxy -> Mend API -->
  <path d="M802 240 C 900 232, 934 230, 992 226" fill="none" stroke="#9aa3af" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>
  <!-- proxy -> downloads -->
  <path d="M802 276 C 900 320, 934 356, 992 372" fill="none" stroke="#9aa3af" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>

  <!-- Mend API (external) -->
  <rect x="992" y="184" width="176" height="90" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="1080" y="214" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="700">saas.mend.io</text>
  <text x="1080" y="234" text-anchor="middle" fill="#6b7280" font-size="12">api-saas.mend.io</text>
  <text x="1080" y="256" text-anchor="middle" fill="#6b7280" font-size="12">login + AI-BOM upload</text>

  <!-- downloads.mend.io (external) -->
  <rect x="992" y="336" width="176" height="82" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="1080" y="368" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="700">downloads.mend.io</text>
  <text x="1080" y="388" text-anchor="middle" fill="#6b7280" font-size="12">CLI binary</text>
  <text x="1080" y="405" text-anchor="middle" fill="#6b7280" font-size="12">(arch-matched) + updates</text>

  <!-- caption -->
  <text x="992" y="464" fill="#1e4fa3" font-size="15.5" font-weight="700">The CLI authenticates itself</text>
  <text x="992" y="490" fill="#3b7fd6" font-size="13.5">The proxy only bounds egress to</text>
  <text x="992" y="509" fill="#3b7fd6" font-size="13.5">*.mend.io — it does not intercept</text>
  <text x="992" y="528" fill="#3b7fd6" font-size="13.5">or inject any credential.</text>
</svg>
