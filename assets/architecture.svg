<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3af"/>
    </marker>
  </defs>

  <rect width="1180" height="620" fill="#ffffff"/>

  <!-- Host machine -->
  <rect x="28" y="40" width="945" height="528" rx="26" fill="#e9f1fc" stroke="#7aa7e0" stroke-width="2.5"/>
  <text x="62" y="542" fill="#1e4fa3" font-size="21" font-weight="700">Host machine</text>

  <!-- Workspace directories -->
  <rect x="66" y="222" width="152" height="82" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="142" y="256" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">Workspace</text>
  <text x="142" y="278" text-anchor="middle" fill="#6b7280" font-size="13">your code</text>
  <line x1="218" y1="263" x2="272" y2="263" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- microVM sandbox -->
  <rect x="278" y="108" width="262" height="352" rx="13" fill="#ffffff" stroke="#6b7787" stroke-width="2"/>
  <text x="298" y="140" fill="#1f2937" font-size="18" font-weight="700">microVM sandbox</text>
  <text x="522" y="140" text-anchor="end" fill="#8a94a6" font-size="13">container</text>

  <!-- container dashed box -->
  <rect x="298" y="156" width="222" height="176" rx="9" fill="none" stroke="#9aa3af" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Agent / Claude -->
  <rect x="314" y="172" width="190" height="56" rx="7" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="409" y="206" text-anchor="middle" fill="#2f6fdb" font-size="16" font-weight="700">Agent / Claude</text>

  <!-- mend-ai-security mixin -->
  <rect x="314" y="244" width="190" height="74" rx="7" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="409" y="270" text-anchor="middle" fill="#2f6fdb" font-size="15" font-weight="700">mend-ai-security</text>
  <text x="409" y="289" text-anchor="middle" fill="#6b7280" font-size="11.5">mend ai scan · AI-BOM</text>
  <text x="409" y="306" text-anchor="middle" fill="#6b7280" font-size="11.5">kind: mixin</text>

  <!-- MEND_USER_KEY -->
  <rect x="298" y="346" width="222" height="72" rx="9" fill="#ece7dd" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="409" y="378" text-anchor="middle" fill="#6b6255" font-size="14" font-weight="600" font-family="'SF Mono', Menlo, monospace">MEND_USER_KEY</text>
  <text x="409" y="399" text-anchor="middle" fill="#8a8272" font-size="13">= proxy-managed</text>

  <!-- sandbox -> proxy -->
  <line x1="540" y1="273" x2="596" y2="273" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Secret store -->
  <rect x="596" y="136" width="182" height="74" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="687" y="168" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">Secret store</text>
  <text x="687" y="190" text-anchor="middle" fill="#6b7280" font-size="12.5">sbx secret set mend</text>
  <line x1="687" y1="210" x2="687" y2="246" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- sbx proxy -->
  <rect x="596" y="248" width="182" height="78" rx="9" fill="#d9f2e4" stroke="#86d6ab" stroke-width="2"/>
  <text x="687" y="282" text-anchor="middle" fill="#1f9d63" font-size="17" font-weight="700">sbx proxy</text>
  <text x="687" y="304" text-anchor="middle" fill="#1f9d63" font-size="13">injects real key</text>

  <!-- Egress policy -->
  <rect x="596" y="350" width="182" height="74" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="687" y="382" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">Egress allow-list</text>
  <text x="687" y="404" text-anchor="middle" fill="#6b7280" font-size="12.5">*.mend.io</text>

  <!-- proxy -> Mend API (crosses host boundary) -->
  <path d="M778 280 C 900 270, 930 240, 992 226" fill="none" stroke="#9aa3af" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>
  <!-- egress -> downloads -->
  <path d="M778 390 C 900 395, 930 390, 992 382" fill="none" stroke="#9aa3af" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>

  <!-- Mend API (external) -->
  <rect x="992" y="184" width="176" height="86" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="1080" y="214" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="700">saas.mend.io</text>
  <text x="1080" y="234" text-anchor="middle" fill="#6b7280" font-size="12">api-saas.mend.io</text>
  <text x="1080" y="254" text-anchor="middle" fill="#6b7280" font-size="12">auth + AI-BOM upload</text>

  <!-- downloads.mend.io (external) -->
  <rect x="992" y="346" width="176" height="82" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="1080" y="378" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="700">downloads.mend.io</text>
  <text x="1080" y="398" text-anchor="middle" fill="#6b7280" font-size="12">CLI binary</text>
  <text x="1080" y="415" text-anchor="middle" fill="#6b7280" font-size="12">(arch-matched) + updates</text>

  <!-- caption -->
  <text x="992" y="480" fill="#1e4fa3" font-size="16" font-weight="700">Your Mend key never</text>
  <text x="992" y="502" fill="#1e4fa3" font-size="16" font-weight="700">enters the sandbox</text>
  <text x="992" y="530" fill="#3b7fd6" font-size="13.5">Proxy swaps it in at</text>
  <text x="992" y="549" fill="#3b7fd6" font-size="13.5">the network boundary</text>
</svg>
